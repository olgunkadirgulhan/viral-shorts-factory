name: Daily viral short

on:
  schedule:
    # 09:00 UTC = 05:00 New York, after the 07:00 UTC quota reset. First slot is 07:00 ET: ~2h for 6 videos.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      videos:
        description: How many videos (slots)
        type: choice
        default: "1"
        options: ["1", "2", "3", "4", "5", "6"]
      dry_run:
        description: Render but do not upload
        type: boolean
        default: true
      fallback_only:
        description: Only the safe market-recap format (no LLM)
        type: boolean
        default: false

concurrency:
  group: viral-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CONTENT_LANG: ${{ vars.CONTENT_LANG || 'en' }}
      LLM_BACKEND: anthropic
      LLM_CREATIVE_BACKEND: anthropic
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
      PUBLISH_TZ: ${{ vars.PUBLISH_TZ || 'America/New_York' }}
      SLOTS: ${{ vars.SLOTS || '07:00=SAVE,09:30=SHARE,12:30=SHARE,15:00=FOLLOW,17:30=SAVE,20:00=SHARE' }}
      MARKET_TICKERS: ${{ vars.MARKET_TICKERS || '^GSPC,^IXIC,^DJI,GC=F,CL=F,DX-Y.NYB,NVDA,AAPL,MSFT,TSLA,AMZN,META' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Skill repos + Python deps (always latest yt-dlp / skills)
        run: |
          git clone --depth 1 https://github.com/Jakeschincariol/youtube-agent-skill.git vendor/youtube-agent-skill
          git clone --depth 1 https://github.com/Ootto-AI/claude-content-skills.git vendor/claude-content-skills
          pip install --disable-pip-version-check -U -r requirements.txt

      - name: Produce and publish
        run: |
          ARGS="--videos ${{ github.event_name == 'schedule' && (vars.VIDEOS_PER_DAY || '2') || inputs.videos }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # Until the YouTube API audit is approved, API uploads get locked private forever.
          # Scheduled runs only render (videos come as artifacts) until PUBLISH_MODE=live is set.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.PUBLISH_MODE }}" != "live" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.fallback_only }}" = "true" ]; then ARGS="$ARGS --fallback-only"; fi
          python daily_viral.py $ARGS

      - name: Videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.json
            logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state (brain, outliers, jobs)
        if: always()
        run: |
          git config user.name "viral-bot"
          git config user.email "viral-bot@users.noreply.github.com"
          git add state/ data/outliers_*.json data/job_*.json data/market_*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "state: $(date -u +%F) daily run"
          git pull --rebase --autostash && git push
